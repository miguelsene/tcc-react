spring.application.name=FashionSpace
server.port=8080
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;databaseName=FashionSpace;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# Limite para upload de imagem base64
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
spring.mvc.async.request-timeout=60000

# Email Configuration (Resend API)
resend.api.key=${RESEND_API_KEY:}
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# App URL for reset password links
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.mobile.reset.url=${APP_MOBILE_RESET_URL:fashionspace://reset-password}

